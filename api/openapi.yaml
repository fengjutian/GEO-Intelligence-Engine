      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReportCreate'}}}}
      responses:
        '202': {description: Report generation queued, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
  /reports/{reportId}:
    get:
