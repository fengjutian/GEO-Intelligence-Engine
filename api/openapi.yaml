openapi: 3.1.0
info:
  title: GEO Intelligence API
  version: 1.0.0
  description: P0 V1.0 public application API. Tenant context is derived from the authenticated session.
servers:
  - url: /api/v1
security:
  - oidc: []
tags:
  - {name: Identity}
  - {name: Projects}
  - {name: Entities}
  - {name: Crawls}
  - {name: Questions}
  - {name: Audits}
  - {name: Engines}
  - {name: Evaluations}
  - {name: Metrics}
  - {name: Reports}
  - {name: Tasks}
paths:
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      responses:
        '200': {description: Current principal, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentUser'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth-config:
    get:
      tags: [Identity]
      operationId: getAuthConfig
      security: []
      responses:
        '200': {description: Public authentication configuration for the web client, content: {application/json: {schema: {type: object, required: [mode], properties: {mode: {type: string, enum: [dev, jwt, oidc]}, issuer: {type: string}, clientId: {type: string}, audience: {type: string}, scope: {type: string}}}}}}
  /tenants/{tenantId}/members:
    parameters: [{$ref: '#/components/parameters/TenantId'}]
    get:
      tags: [Identity]
      operationId: listMembers
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Member page, content: {application/json: {schema: {$ref: '#/components/schemas/MemberPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /tenants/{tenantId}/members/{memberId}:
    patch:
      tags: [Identity]
      operationId: updateMember
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {name: memberId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {role: {type: string, enum: [Owner, ProjectAdmin, Analyst, Editor, Approver, Viewer]}, status: {type: string, enum: [active, disabled]}}}}}}
      responses:
        '200': {description: Updated member, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /invitations/{invitationAction}:
    post:
      tags: [Identity]
      operationId: acceptInvitation
      parameters: [{name: invitationAction, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Membership created or activated, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tenants/{tenantId}/invitations:
    parameters: [{$ref: '#/components/parameters/TenantId'}]
    post:
      tags: [Identity]
      operationId: inviteMember
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationCreate'}}}}
      responses:
        '201': {description: Invitation created, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: status, in: query, schema: {type: string}}]
      responses:
        '200': {description: Project page, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectPage'}}}}
    post:
      tags: [Projects]
      operationId: createProject
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectCreate'}}}}
      responses:
        '201': {description: Project created, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      tags: [Projects]
      operationId: getProject
      responses:
        '200': {description: Project, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Projects]
      operationId: updateProject
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/ProjectPatch'}}}}
      responses:
        '200': {description: Updated project, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}:archive:
    post:
      tags: [Projects]
      operationId: archiveProject
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '202': {description: Archive accepted, content: {application/json: {schema: {$ref: '#/components/schemas/JobRef'}}}}
  /projects/{projectId}/config-versions:
    post:
      tags: [Projects]
      operationId: publishProjectConfig
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '201': {description: Immutable configuration published, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectConfigVersion'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/brand-profile:
    get:
      tags: [Projects]
      operationId: getBrandProfile
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: Brand profile, content: {application/json: {schema: {$ref: '#/components/schemas/BrandProfile'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/brand-aliases:
    post:
      tags: [Projects]
      operationId: createBrandAlias
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BrandAliasCreate'}}}}
      responses:
        '201': {description: Alias created, content: {application/json: {schema: {$ref: '#/components/schemas/BrandAlias'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/brand-aliases/{aliasId}:
    patch:
      tags: [Projects]
      operationId: setBrandAliasEnabled
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {name: aliasId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      requestBody: {required: true, content: {application/merge-patch+json: {schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}, additionalProperties: false}}}}
      responses:
        '200': {description: Alias updated, content: {application/json: {schema: {$ref: '#/components/schemas/BrandAlias'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/products:
    post:
      tags: [Projects]
      operationId: createProduct
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductCreate'}}}}
      responses:
        '201': {description: Product created, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
  /projects/{projectId}/competitors:
    post:
      tags: [Projects]
      operationId: createCompetitor
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompetitorCreate'}}}}
      responses:
        '201': {description: Competitor created, content: {application/json: {schema: {$ref: '#/components/schemas/Competitor'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/crawl-runs:
    get:
      tags: [Crawls]
      operationId: listProjectCrawlRuns
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: Recent crawl runs, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/CrawlRun'}}}}}}}
    post:
      tags: [Crawls]
      operationId: createCrawlRun
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CrawlRunCreate'}}}}
      responses:
        '202': {description: Crawl queued, content: {application/json: {schema: {$ref: '#/components/schemas/CrawlRun'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /crawl-runs/{crawlRunId}:
    get:
      tags: [Crawls]
      operationId: getCrawlRun
      parameters: [{$ref: '#/components/parameters/CrawlRunId'}]
      responses:
        '200': {description: Crawl run, content: {application/json: {schema: {$ref: '#/components/schemas/CrawlRun'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /crawl-runs/{crawlRunId}:{action}:
    post:
      tags: [Crawls]
      operationId: controlCrawlRun
      parameters:
        - {$ref: '#/components/parameters/CrawlRunId'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [pause, resume, cancel]}
      responses:
        '202': {description: Action accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CrawlRun'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /crawl-runs/{crawlRunId}/pages:
    get:
      tags: [Crawls]
      operationId: listCrawlPages
      parameters: [{$ref: '#/components/parameters/CrawlRunId'}]
      responses:
        '200': {description: Crawled pages, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/PageSummary'}}}}}}}
  /page-contents/{contentId}:
    get:
      tags: [Crawls]
      operationId: getPageContent
      parameters: [{name: contentId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses:
        '200': {description: Immutable page content metadata and links, content: {application/json: {schema: {$ref: '#/components/schemas/PageDetail'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /crawl-runs/{crawlRunId}/findings:
    get:
      tags: [Crawls]
      operationId: listCrawlFindings
      parameters: [{$ref: '#/components/parameters/CrawlRunId'}]
      responses:
        '200': {description: Versioned technical findings, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/TechnicalFinding'}}}}}}}
  /crawl-runs/{crawlRunId}/content-analysis-runs:
    post:
      tags: [Crawls]
      operationId: runContentAnalysis
      parameters: [{name: crawlRunId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses:
        '201': {description: Content analysis run, content: {application/json: {schema: {type: object, required: [id, status], properties: {id: {$ref: '#/components/schemas/Id'}, crawlRunId: {$ref: '#/components/schemas/Id'}, analyzerVersion: {type: string}, status: {type: string}, pages: {type: integer}, findings: {type: integer}}}}}}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /content-analysis-runs/{analysisRunId}:
    get:
      tags: [Crawls]
      operationId: getContentAnalysisRun
      parameters: [{name: analysisRunId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses:
        '200': {description: Content analysis run, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
  /projects/{projectId}/findings:
    get:
      tags: [Crawls]
      operationId: listProjectFindings
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {name: rulePrefix, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        '200': {description: Project findings, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object, additionalProperties: true}}}}}}}
  /findings/{findingId}:
    patch:
      tags: [Crawls]
      operationId: updateFinding
      parameters: [{name: findingId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [open, confirmed, dismissed, accepted_risk, resolved]}, reason: {type: string}}}}}}
      responses:
        '200': {description: Updated finding, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /crawl-runs/{crawlRunId}/robots:
    get:
      tags: [Crawls]
      operationId: getCrawlRobotsEvidence
      parameters: [{$ref: '#/components/parameters/CrawlRunId'}]
      responses:
        '200': {description: Robots.txt snapshots used by the crawl run, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/RobotsEvidence'}}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /crawl-runs/{crawlRunId}/sitemaps:
    get:
      tags: [Crawls]
      operationId: listCrawlSitemapEvidence
      parameters: [{$ref: '#/components/parameters/CrawlRunId'}]
      responses:
        '200': {description: Sitemap documents and parse errors from the crawl run, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SitemapEvidence'}}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/questions:
    get:
      tags: [Questions]
      operationId: listQuestions
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Question page, content: {application/json: {schema: {$ref: '#/components/schemas/QuestionPage'}}}}
    post:
      tags: [Questions]
      operationId: createQuestion
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuestionCreate'}}}}
      responses:
        '201': {description: Question, content: {application/json: {schema: {$ref: '#/components/schemas/Question'}}}}
  /projects/{projectId}/question-sets:
    get:
      tags: [Questions]
      operationId: listQuestionSets
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: Question sets with draft and published versions, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/QuestionSet'}}}}}}}
  /question-sets/{questionSetId}/versions:
    post:
      tags: [Questions]
      operationId: publishQuestionSetVersion
      parameters: [{name: questionSetId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses:
        '201': {description: Immutable published version, content: {application/json: {schema: {type: object, required: [id, version, questionCount], properties: {id: {$ref: '#/components/schemas/Id'}, version: {type: integer}, questionCount: {type: integer}}}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/entities:
    get:
      tags: [Entities]
      operationId: listProjectEntities
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {name: type, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200': {description: Extracted entities, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Entity'}}}}}}}
  /entities/{entityId}:
    get:
      tags: [Entities]
      operationId: getEntity
      parameters: [{name: entityId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses:
        '200': {description: Entity with aliases, evidence and relations, content: {application/json: {schema: {$ref: '#/components/schemas/EntityDetail'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Entities]
      operationId: updateEntityStatus
      parameters: [{name: entityId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [proposed, confirmed, rejected]}}}}}}
      responses:
        '200': {description: Updated entity, content: {application/json: {schema: {$ref: '#/components/schemas/Entity'}}}}
  /entities:merge:
    post:
      tags: [Entities]
      operationId: mergeEntities
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [sourceEntityId, targetEntityId], properties: {sourceEntityId: {$ref: '#/components/schemas/Id'}, targetEntityId: {$ref: '#/components/schemas/Id'}, reason: {type: string}}}}}}
      responses:
        '201': {description: Merge event, content: {application/json: {schema: {$ref: '#/components/schemas/EntityMerge'}}}}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /entity-merges/{mergeId}:undo:
    post:
      tags: [Entities]
      operationId: undoEntityMerge
      parameters: [{name: mergeId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses:
        '200': {description: Undone merge event, content: {application/json: {schema: {$ref: '#/components/schemas/EntityMerge'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/knowledge-snapshots:
    post:
      tags: [Entities]
      operationId: publishKnowledgeSnapshot
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '201': {description: Published knowledge snapshot, content: {application/json: {schema: {type: object, required: [id, projectId, version, status], properties: {id: {$ref: '#/components/schemas/Id'}, projectId: {$ref: '#/components/schemas/Id'}, version: {type: integer}, status: {type: string}}}}}}
  /projects/{projectId}/content-quality:
    get:
      tags: [Entities]
      operationId: getContentQuality
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: Content rule counts, content: {application/json: {schema: {type: object, required: [total, bySeverity, byRule], properties: {total: {type: integer}, bySeverity: {type: object, additionalProperties: {type: integer}}, byRule: {type: array, items: {type: object, additionalProperties: true}}}}}}}
  /projects/{projectId}/measurement-protocols:
    get:
      tags: [Audits]
      operationId: listMeasurementProtocols
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: Protocol versions, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/MeasurementProtocol'}}}}}}}
    post:
      tags: [Audits]
      operationId: createMeasurementProtocol
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MeasurementProtocolCreate'}}}}
      responses:
        '201': {description: Draft protocol, content: {application/json: {schema: {$ref: '#/components/schemas/MeasurementProtocol'}}}}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /measurement-protocols/{protocolId}:publish:
    post:
      tags: [Audits]
      operationId: publishProtocol
      parameters: [{$ref: '#/components/parameters/ProtocolId'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {description: Published protocol, content: {application/json: {schema: {$ref: '#/components/schemas/MeasurementProtocol'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /audits:estimate:
    post:
      tags: [Audits]
      operationId: estimateAudit
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuditCreate'}}}}
      responses:
        '200': {description: Estimate, content: {application/json: {schema: {$ref: '#/components/schemas/AuditEstimate'}}}}
  /audits:
    post:
      tags: [Audits]
      operationId: createAudit
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuditCreate'}}}}
      responses:
        '202': {description: Audit queued, content: {application/json: {schema: {$ref: '#/components/schemas/Audit'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /audits/{auditId}:
    get:
      tags: [Audits]
      operationId: getAudit
      parameters: [{$ref: '#/components/parameters/AuditId'}]
      responses:
        '200': {description: Audit, content: {application/json: {schema: {$ref: '#/components/schemas/Audit'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /audits/{auditId}:cancel:
    post:
      tags: [Audits]
      operationId: cancelAudit
      parameters: [{$ref: '#/components/parameters/AuditId'}]
      responses:
        '202': {description: Cancellation requested, content: {application/json: {schema: {$ref: '#/components/schemas/Audit'}}}}
  /audits/{auditId}/samples:
    get:
      tags: [Audits]
      operationId: listAuditSamples
      parameters: [{$ref: '#/components/parameters/AuditId'}]
      responses:
        '200': {description: Expanded samples, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditSample'}}}}}}}
  /engine-configs:
    get:
      tags: [Engines]
      operationId: listEngineConfigs
      responses:
        '200': {description: Engine configurations, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/EngineConfig'}}}}}
    post:
      tags: [Engines]
      operationId: createEngineConfig
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EngineConfigCreate'}}}}
      responses:
        '201': {description: Engine configuration, content: {application/json: {schema: {$ref: '#/components/schemas/EngineConfig'}}}}
  /model-providers:
    get:
      tags: [Engines]
      operationId: listModelProviders
      responses:
        '200': {description: Provider configuration status without credentials, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/ModelProviderStatus'}}}}}}}
  /model-providers/{provider}/health:
    post:
      tags: [Engines]
      operationId: checkModelProviderHealth
      parameters: [{name: provider, in: path, required: true, schema: {type: string, enum: [deepseek, minimax]}}]
      responses:
        '200': {description: Provider is reachable and authenticated}
        '409': {$ref: '#/components/responses/Conflict'}
  /model-gateway/chat:
    post:
      tags: [Engines]
      operationId: createModelChatCompletion
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelChatRequest'}}}}
      responses:
        '200': {description: Normalized model response, content: {application/json: {schema: {$ref: '#/components/schemas/ModelChatResponse'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /responses/{responseId}/evaluations:
    get:
      tags: [Evaluations]
      operationId: listResponseEvaluations
      parameters: [{$ref: '#/components/parameters/ResponseId'}]
      responses:
        '200': {description: Evaluation versions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AnswerEvaluation'}}}}}
  /review-queue/{reviewItemId}/annotations:
    post:
      tags: [Evaluations]
      operationId: annotateReviewItem
      parameters: [{$ref: '#/components/parameters/ReviewItemId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HumanAnnotationCreate'}}}}
      responses:
        '201': {description: Annotation created, content: {application/json: {schema: {$ref: '#/components/schemas/HumanAnnotation'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /audits/{auditId}/metrics:
    get:
      tags: [Metrics]
      operationId: getAuditMetrics
      parameters:
        - {$ref: '#/components/parameters/AuditId'}
        - {name: aggregationMethod, in: query, schema: {type: string, enum: [answer_equal, question_equal, business_weighted], default: answer_equal}}
        - {name: channel, in: query, schema: {type: string, enum: [model_api, search_api, consumer_app_capture]}}
      responses:
        '200': {description: Metrics, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MetricValue'}}}}}
  /metric-values/{metricValueId}/evidence:
    get:
      tags: [Metrics]
      operationId: getMetricEvidence
      parameters: [{name: metricValueId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
      responses:
