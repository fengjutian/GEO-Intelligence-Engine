    get:
      tags: [Tasks]
      operationId: listTaskEvents
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200': {description: Task event timeline, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object, additionalProperties: true}}}}}}}
  /optimization-tasks/{taskId}:transition:
