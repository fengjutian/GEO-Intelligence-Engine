      responses:
        '200': {description: Updated task, content: {application/json: {schema: {$ref: '#/components/schemas/OptimizationTask'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /optimization-tasks/{taskId}/comments:
    post:
      tags: [Tasks]
      operationId: addTaskComment
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [body], properties: {body: {type: string, minLength: 1, maxLength: 5000}}}}}}
      responses:
        '201': {description: Task comment, content: {application/json: {schema: {type: object, required: [id, body, createdAt], properties: {id: {$ref: '#/components/schemas/Id'}, authorId: {$ref: '#/components/schemas/Id'}, body: {type: string}, createdAt: {type: string, format: date-time}}}}}}
