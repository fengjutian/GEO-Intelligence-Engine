      tags: [Tasks]
      operationId: transitionOptimizationTask
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskTransition'}}}}
      responses:
        '200': {description: Updated task, content: {application/json: {schema: {$ref: '#/components/schemas/OptimizationTask'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.com/realms/geo/.well-known/openid-configuration
  parameters:
    TenantId: {name: tenantId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ProjectId: {name: projectId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    CrawlRunId: {name: crawlRunId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ProtocolId: {name: protocolId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    AuditId: {name: auditId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ResponseId: {name: responseId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ReviewItemId: {name: reviewItemId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ReportId: {name: reportId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    FindingId: {name: findingId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    TaskId: {name: taskId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 500}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[0-9]+"$'}}
  responses:
    Unauthorized: {description: Authentication required, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Forbidden: {description: Authenticated but action forbidden, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    NotFound: {description: Resource absent or outside tenant, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Conflict: {description: State, version, or idempotency conflict, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    UnprocessableEntity: {description: Request is syntactically valid but cannot be processed, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    Id: {type: string, format: uuid}
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        traceId: {type: string}
        retryable: {type: boolean, default: false}
        errors: {type: array, items: {type: object, additionalProperties: true}}
    PageMeta:
      type: object
      required: [hasMore]
      properties: {nextCursor: {type: [string, 'null']}, hasMore: {type: boolean}}
    CurrentUser:
      type: object
      required: [id, email, tenants]
      properties: {id: {$ref: '#/components/schemas/Id'}, email: {type: string, format: email}, tenants: {type: array, items: {$ref: '#/components/schemas/Member'}}}
    Member:
      type: object
      required: [id, userId, role, status]
      properties: {id: {$ref: '#/components/schemas/Id'}, userId: {$ref: '#/components/schemas/Id'}, email: {type: string}, role: {type: string, enum: [Owner, ProjectAdmin, Analyst, Editor, Approver, Viewer]}, status: {type: string}}
    MemberPage: {type: object, required: [items, page], properties: {items: {type: array, items: {$ref: '#/components/schemas/Member'}}, page: {$ref: '#/components/schemas/PageMeta'}}}
    InvitationCreate: {type: object, required: [email, role], properties: {email: {type: string, format: email}, role: {type: string, enum: [ProjectAdmin, Analyst, Editor, Approver, Viewer]}, projectIds: {type: array, items: {$ref: '#/components/schemas/Id'}}}}
    Invitation: {allOf: [{$ref: '#/components/schemas/InvitationCreate'}, {type: object, required: [id, status, expiresAt], properties: {id: {$ref: '#/components/schemas/Id'}, status: {type: string}, expiresAt: {type: string, format: date-time}}}]}
    Entity:
      type: object
      required: [id, projectId, entityType, canonicalName, status]
      properties: {id: {$ref: '#/components/schemas/Id'}, projectId: {$ref: '#/components/schemas/Id'}, entityType: {type: string, enum: [Organization, Brand, Product, SoftwareApplication]}, canonicalName: {type: string}, normalizedName: {type: string}, status: {type: string, enum: [proposed, confirmed, rejected]}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}
    EntityDetail:
      allOf: [{$ref: '#/components/schemas/Entity'}, {type: object, properties: {aliases: {type: array, items: {type: string}}, evidence: {type: array, items: {type: object, additionalProperties: true}}, relations: {type: array, items: {type: object, additionalProperties: true}}}}]
    EntityMerge:
      type: object
      required: [id, sourceEntityId, targetEntityId, status]
      properties: {id: {$ref: '#/components/schemas/Id'}, sourceEntityId: {$ref: '#/components/schemas/Id'}, targetEntityId: {$ref: '#/components/schemas/Id'}, reason: {type: string}, status: {type: string, enum: [active, undone]}, occurredAt: {type: string, format: date-time}}
