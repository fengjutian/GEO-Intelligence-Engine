    BrandAliasCreate: {type: object, required: [alias, aliasType], properties: {alias: {type: string, maxLength: 300}, aliasType: {type: string, enum: [alias, old_name, abbreviation, product_short_name]}, locale: {type: [string, 'null'], maxLength: 35}}}
    BrandAlias: {allOf: [{$ref: '#/components/schemas/BrandAliasCreate'}, {type: object, required: [id, enabled, createdAt], properties: {id: {$ref: '#/components/schemas/Id'}, enabled: {type: boolean}, createdAt: {type: string, format: date-time}}}]}
