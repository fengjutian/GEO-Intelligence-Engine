[project]
name = "geo-judge-worker"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.121,<1", "pydantic>=2.12,<3", "uvicorn[standard]>=0.38,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_judge"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
